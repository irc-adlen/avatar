services:
  faceapp:
    build:
      context: .
      dockerfile: python/Dockerfile
    image: faceapp:latest
    depends_on:
      - db
    devices:
      - "/dev/video0:/dev/video0"
    # Allow access to host X11 for GUI display (cv2.imshow). Note: this exposes X server to container.
    environment:
      - INSIGHTFACE_PROVIDER=CPUExecutionProvider
      - DISPLAY=${DISPLAY}
    volumes:
      - /tmp/.X11-unix:/tmp/.X11-unix
      # Bind-mount local source for hot-reload during development
      - ./python:/app:rw
      # Persist insightface models so they aren't re-downloaded every start
      - insightface_models:/root/.insightface/models
    # Some systems need privileged to access webcam devices; remove if not required.
    privileged: true
    restart: unless-stopped
    # If you prefer using host networking (may simplify device access), uncomment:
    # network_mode: "host"

  db:
    image: postgres:15
    environment:
      POSTGRES_USER: faceuser
      POSTGRES_PASSWORD: facepass
      POSTGRES_DB: facedb
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    ports:
      - "5432:5432"
    restart: unless-stopped

volumes:
  pgdata:
    name: avatar_pgdata
  insightface_models:
    name: avatar_insightface_models
