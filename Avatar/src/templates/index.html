<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <title>TalkingHead - Auto Wake Up</title>
  <style>
    body, html { width: 100%; height: 100%; margin: 0; background: #202020; color: white; font-family: sans-serif; }
    #avatar { width: 100%; height: 100%; }
    #overlay {
      position: absolute; top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(0,0,0,0.8); display: flex; justify-content: center; align-items: center; z-index: 10;
    }
    button { padding: 15px 30px; font-size: 20px; cursor: pointer; background: #00d2ff; border: none; font-weight: bold; }
    #loading { position: absolute; top: 10px; left: 10px; font-family: monospace; color: lime; }
  </style>

  <script type="importmap">
  {
    "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.154.0/build/three.module.js",
      "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.154.0/examples/jsm/",
      "marked": "https://cdn.jsdelivr.net/npm/marked/lib/marked.esm.js",
      "talkinghead": "https://cdn.jsdelivr.net/gh/met4citizen/TalkingHead@1.5/modules/talkinghead.mjs"
    }
  }
  </script>
</head>

<body>
  <div id="avatar"></div>
  <div id="loading">Chargement Avatar...</div>
  <div id="overlay"><button id="startBtn" disabled>CHARGEMENT...</button></div>
<script src="https://unpkg.com/mqtt/dist/mqtt.min.js"></script>

<script type="module">
import { TalkingHead } from "talkinghead";

let head;
let socket = null;
let mqttClient = null;

// ==========================================
// 1. CONFIGURATION DU STREAM
// ==========================================
// On stocke les options ici pour pouvoir relancer le stream facilement
const STREAM_OPTIONS = {
    sampleRate: 24000, 
    lipsyncType: "words", 
    gain: 2.0,
    lipsyncLang: 'en'
};

// ==========================================
// 2. OUTILS DE CONVERSION
// ==========================================
function float32ToInt16(float32Array) {
  const int16Array = new Int16Array(float32Array.length);
  for (let i = 0; i < float32Array.length; i++) {
    const s = Math.max(-1, Math.min(1, float32Array[i]));
    int16Array[i] = s < 0 ? s * 0x8000 : s * 0x7FFF;
  }
  return int16Array.buffer;
}

function base64ToFloat32(b64) {
  const binary = atob(b64);
  const bytes = new Uint8Array(binary.length);
  for (let i = 0; i < binary.length; i++) bytes[i] = binary.charCodeAt(i);
  return new Float32Array(bytes.buffer);
}

// ==========================================
// 3. LOGIQUE SOCKET INTELLIGENTE
// ==========================================

function send_finish(){
  const url = "http://localhost:5007/start_session"; // Remplacez par votre URL

  fetch(url)
      .then(response => {
          if (response.ok) {
              console.log("✅ Requête GET envoyée avec succès !");
          } else {
              console.error("⚠️ Erreur serveur :", response.status);
          }
      })
      .catch(error => {
          console.error("❌ Erreur réseau ou technique :", error);
      });
}

// Cette fonction vérifie si l'avatar dort. Si oui, elle le réveille.
function ensureAvatarIsListening() {
    if (head && !head.isStreaming) {
        console.log("🔔 Réveil de l'avatar (Nouvelle phrase détectée)");
        head.streamStart(STREAM_OPTIONS, null, () => {
                console.log("🛑 FIN DE PAROLE (Trigger détecté !)");
                send_finish();
            });
    }
}

function connectSocket() {
  // Reset initial
  if (socket) socket.close();
  if (head && head.isStreaming) head.streamStop();

  socket = new WebSocket("ws://localhost:8000/stream/audio");



  socket.onopen = () => {
    console.log("🟢 WS Connecté");
    // Premier démarrage
    head.streamStart(STREAM_OPTIONS,null, () => {
                console.log("🛑 FIN DE PAROLE (Trigger détecté !)");
                send_finish();
                        
            });
  };

  socket.onmessage = (e) => {
    const msg = JSON.parse(e.data);

    // --- AUDIO ---
    if (msg.type === "audio") {
      // 1. D'abord, on s'assure que le stream est ouvert !
      ensureAvatarIsListening();

      const f32 = base64ToFloat32(msg.data);
      const pcm16 = float32ToInt16(f32);
      head.streamAudio({ audio: pcm16 });
    } 
    
    // --- MOTS ---
    else if (msg.type === "meta") {
      const c = msg.content || {};
      const word = c.text || c.word;

      if (word) {
        // 1. Ici aussi, on vérifie (au cas où les mots arrivent avant le son)
        ensureAvatarIsListening();

        head.streamAudio({
          audio: new ArrayBuffer(0), 
          words: [word],
          wtimes: [c.start_s * 1000],      
          wdurations: [(c.stop_s - c.start_s) * 1000]
        });
      }
    }
  };

  socket.onerror = (err) => console.error("🔴 Erreur Socket:", err);
}

// ==========================================
// 4. MAIN
// ==========================================
document.addEventListener("DOMContentLoaded", async () => {
  const btn = document.getElementById("startBtn");
  const loading = document.getElementById("loading");

  try {
    head = new TalkingHead(document.getElementById("avatar"), {
              ttsEndpoint: "https://eu-texttospeech.googleapis.com/v1beta1/text:synthesize",
        ttsApikey: "AIzaSyDDRrScM3t-ko-5s-YCapCxdw5O0E52Hf0", // <- Change this
      cameraView: "upper"
    });

    await head.showAvatar({
      url: "https://models.readyplayer.me/693fc00c14ff705000213c26.glb?morphTargets=ARKit,Oculus+Visemes,mouthOpen,mouthSmile,eyesClosed,eyesLookUp,eyesLookDown",
      body: "F",
      avatarMood: "neutral",
      lipsyncLang: "en" 
    });

    loading.style.display = "none";
    btn.innerText = "DÉMARRER";
    btn.disabled = false;

  } catch (err) {
    console.error(err);
    loading.innerText = "ERREUR";
    loading.style.color = "red";
  }

  btn.addEventListener("click", async () => {
    document.getElementById("overlay").style.display = "none";
    if (head.audioCtx.state === "suspended") await head.audioCtx.resume();
   
    connectSocket();
  });
});
</script>
</body>
</html>
