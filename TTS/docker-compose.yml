version: "3.8"

services:
  # ==========================================
  # SERVICE 1 : LE CERVEAU (Intelligence / GPU)
  # ==========================================
  cpe-brain:
    build: ./api
    container_name: cpe-brain
    ports:
      - "8000:8000"
    volumes:
      # Vos documents pour le RAG
      - ../LLM/data:/data
      # La persistance de l'index vectoriel (pour ne pas réindexer à chaque fois)
      - ../LLM/vector_db:/vector_db
      # Cache HuggingFace pour ne pas retélécharger le modèle Mistral à chaque reboot
      - hf_cache:/root/.cache/huggingface
    environment:
      # Connexion à Mongo via le nom du service docker
      - MONGO_URI=mongodb://mongo_db:27017
      # - HUGGING_FACE_HUB_TOKEN=votre_token_huggingface_ici
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all # Utilise les 2 GPUs
              capabilities: [gpu]
    # Important pour vLLM en multi-GPU (mémoire partagée)
    ipc: host
    depends_on:
      - mongo_db
    networks:
      - cpe-network

  # ==========================================
  # SERVICE 2 : L'ORCHESTRATEUR (Gateway / CPU)
  # ==========================================
  orchestrator:
    build: ../LLM/app
    container_name: cpe-orchestrator
    ports:
      - "8001:8001"
    environment:
      # Indique où trouver le cerveau (nom du service ci-dessus)
      - CPE_BRAIN_HOST=cpe-brain

      # Indique où trouver Moshi (host.docker.internal = votre machine physique)
      # Si Moshi est un autre conteneur, mettez son nom ici.
      - MOSHI_HOST=host.docker.internal
    extra_hosts:
      # Permet au conteneur de voir le localhost de votre machine Ubuntu
      - "host.docker.internal:host-gateway"
    depends_on:
      - cpe-brain
    networks:
      - cpe-network

  # ==========================================
  # SERVICE 3 : MÉMOIRE (MongoDB)
  # ==========================================
  mongo_db:
    image: mongo:latest
    container_name: cpe-mongo
    volumes:
      - mongo_data:/data/db
    ports:
      - "27017:27017" # Accessible aussi depuis votre PC pour débugger
    networks:
      - cpe-network

# ==========================================
# VOLUMES & RÉSEAUX
# ==========================================
volumes:
  hf_cache: # Cache des modèles IA
  mongo_data: # Persistance des conversations

networks:
  cpe-network:
    driver: bridge
