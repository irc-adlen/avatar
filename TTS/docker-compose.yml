version: '3.8'

services:
  # --- Service 1 : LLM (Ollama) ---
  ollama:
    image: ollama/ollama:latest
    container_name: moshi_ollama
    volumes:
      - ollama_data:/root/.ollama
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    networks:
      - moshi_net
    # Commande pour pré-charger le modèle au démarrage (optionnel mais pratique)
    entrypoint: ["/bin/sh", "-c", "ollama serve & sleep 5 && ollama pull qwen2.5:32b && wait"]

  # --- Service 2 : TTS (Moshi) ---
  moshi:
    build: ./moshi
    container_name: moshi_server
    volumes:
      - moshi_data:/app/data_moshi  # Persistance des modèles
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    ports:
      - "8080:8080"
    networks:
      - moshi_net

  # --- Service 3 : Agent (Client Python) ---
  agent:
    build: ./api
    container_name: moshi_agent
    depends_on:
      - moshi
      - ollama
    environment:
      - DISPLAY=${DISPLAY}
      - PULSE_SERVER=unix:${XDG_RUNTIME_DIR}/pulse/native
    volumes:
      # Montage pour l'audio (PulseAudio)
      - ${XDG_RUNTIME_DIR}/pulse/native:${XDG_RUNTIME_DIR}/pulse/native
      - ~/.config/pulse/cookie:/root/.config/pulse/cookie
    devices:
      - /dev/snd:/dev/snd  # Accès direct à la carte son (alternative à Pulse)
    networks:
      - moshi_net
    stdin_open: true # Pour pouvoir taper dans le terminal
    tty: true

volumes:
  ollama_data:
  moshi_data:

networks:
  moshi_net: