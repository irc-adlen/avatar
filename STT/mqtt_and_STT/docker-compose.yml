services:
  mqtt_stt:
    build:
      context: .
      dockerfile: ./Dockerfile
    image: mqtt_stt:latest
    networks:
      - mqtt
    extra_hosts:
    - "host.docker.internal:host-gateway"

    ports:
      - "5007:5007"

    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ./records:/app/records
      - ./cacheHuggingFace:/root/.cache/huggingface
    devices:
      - /dev/snd:/dev/snd
    group_add:
      - "audio"
    runtime: nvidia
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    restart: unless-stopped


networks:
  mqtt:
    driver: bridge