<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <title>TalkingHead – Real-time Audio + Lipsync</title>

  <style>
    body, html {
      width: 100%;
      height: 100%;
      max-width: 800px;
      margin: auto;
      background: #202020;
      color: white;
    }
    #avatar {
      width: 100%;
      height: 100%;
    }
    #loading {
      position: absolute;
      bottom: 10px;
      left: 10px;
      font-family: Arial;
      font-size: 18px;
    }
  </style>

  <script type="importmap">
  {
    "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js/+esm",
      "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.180.0/examples/jsm/",
      "talkinghead": "https://cdn.jsdelivr.net/gh/met4citizen/TalkingHead@1.5/modules/talkinghead.mjs"
    }
  }
  </script>
</head>

<body>
  <div id="avatar"></div>
  <div id="loading">Chargement avatar…</div>

<script type="module">
import { TalkingHead } from "talkinghead";

/* ============================================================
   VARIABLES GLOBALES
============================================================ */
let head;
let socket;
let pcmNode;
const wordQueue = [];
let streamStartTime = null;

/* ============================================================
   AUDIO WORKLET (PCM FLOAT32)
============================================================ */
async function initAudioWorklet() {
  const workletCode = `
    class PCMPlayer extends AudioWorkletProcessor {
      constructor() {
        super();
        this.queue = [];
        this.port.onmessage = e => {
          this.queue.push(...e.data);
        };
      }
      process(_, outputs) {
        const out = outputs[0][0];
        for (let i = 0; i < out.length; i++) {
          out[i] = this.queue.length ? this.queue.shift() : 0;
        }
        return true;
      }
    }
    registerProcessor("pcm-player", PCMPlayer);
  `;

  const blob = new Blob([workletCode], { type: "application/javascript" });
  const url = URL.createObjectURL(blob);

  await head.audioCtx.audioWorklet.addModule(url);
  pcmNode = new AudioWorkletNode(head.audioCtx, "pcm-player");
  pcmNode.connect(head.audioCtx.destination);
}

/* ============================================================
   BASE64 → FLOAT32
============================================================ */
function base64ToFloat32(b64) {
  const binary = atob(b64);
  const len = binary.length;
  const bytes = new Uint8Array(len);
  for (let i = 0; i < len; i++) bytes[i] = binary.charCodeAt(i);
  return new Float32Array(bytes.buffer);
}

/* ============================================================
   SOCKET
============================================================ */

function connectSocket() {
  socket = new WebSocket("ws://localhost:5003/stream");

  socket.onopen = async () => {
    console.log("🟢 WS connecté");

    if (head.audioCtx.state !== "running") {
      await head.audioCtx.resume();
    }

    // horloge de référence
    streamStartTime = head.audioCtx.currentTime * 1000;
  };

  socket.onmessage = e => {
    const data = JSON.parse(e.data);
    const type = data.type;

    switch (type) {

      /* ===================== AUDIO ===================== */
      case "audio": {
        const pcm = base64ToFloat32(data.data);
        pcmNode.port.postMessage(pcm);
        break;
      }

      /* ===================== TIMESTAMPS ===================== */
      case "timestamp": {
        const c = data.content || {};
        const word = c.word || c.text;
        if (!word) return;

        wordQueue.push({
          word,
          start: c.start * 1000,
          end: c.end * 1000,
          done: false
        });
        break;
      }

      /* ===================== META / DEBUG ===================== */
      case "meta":
        console.log("META:", data.content);
        break;

      case "error":
        console.error("❌ WS ERROR:", data.message);
        break;
    }
  };

  socket.onerror = err => {
    console.error("🔴 WS error", err);
  };
}


/* ============================================================
   LIPSYNC LOOP
============================================================ */
function lipsyncLoop() {
  if (!streamStartTime) {
    requestAnimationFrame(lipsyncLoop);
    return;
  }

  const now = head.audioCtx.currentTime * 1000 - streamStartTime;

  for (const w of wordQueue) {
    if (!w.done && now >= w.start) {
      head.lipsync.startWord(
        w.word,
        w.end - w.start
      );
      w.done = true;
    }
  }

  requestAnimationFrame(lipsyncLoop);
}

/* ============================================================
   INIT
============================================================ */
document.addEventListener("DOMContentLoaded", async () => {
  const avatarNode = document.getElementById("avatar");
  const loadingNode = document.getElementById("loading");

  head = new TalkingHead(avatarNode, {
    ttsEndpoint: "https://eu-texttospeech.googleapis.com/v1beta1/text:synthesize",
    ttsApikey: "AIzaSyDDRrScM3t-ko-5s-YCapCxdw5O0E52Hf0", 
    lipsyncModules: ["en"],
    cameraView: "upper"
  });

  await head.showAvatar({
    url: "https://models.readyplayer.me/693fc00c14ff705000213c26.glb?morphTargets=ARKit,Oculus+Visemes,mouthOpen,mouthSmile,eyesClosed,eyesLookUp,eyesLookDown",
    body: "F",
    avatarMood: "neutral",
    lipsyncLang: "en"
  });

  loadingNode.style.display = "none";

  await initAudioWorklet();
  connectSocket();
  lipsyncLoop();
});
</script>

</body>
</html>
