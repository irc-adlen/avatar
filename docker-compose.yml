services:
  avatar:
    image: avatar
    build:
      context: ./avatar
      dockerfile: ./Dockerfile
    ports:
      - "5003:5003"
    extra_hosts:
    - "host.docker.internal:host-gateway"

  faceapp:
    build:
      context: ./FaceRecognition
      dockerfile: python/Dockerfile
    image: faceapp:latest
    devices:
      - "/dev/video0:/dev/video0"
    environment:
      - INSIGHTFACE_PROVIDER=CPUExecutionProvider
    volumes:
      - ./python:/app:rw
      - .env:/app/.env
      - ./insightface_models:/root/.insightface/models
    privileged: true
    ports:
      - "5006:5006"
    extra_hosts:
      - "host.docker.internal:host-gateway"

  stt:
    build:
      context: ./STT
      dockerfile: ./Dockerfile
    image: stt:latest
    extra_hosts:
    - "host.docker.internal:host-gateway"
    ports:
      - "5007:5007"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ./records:/app/records
      - ./cacheHuggingFace:/root/.cache/huggingface
    devices:
      - /dev/snd:/dev/snd
    group_add:
      - "audio"
    gpus: all
    restart: unless-stopped